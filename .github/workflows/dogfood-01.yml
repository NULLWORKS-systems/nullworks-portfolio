name: DOGFOOD-01 assurance gates
on:
  push:
    paths:
      - 'src/lib/dogfood/**'
      - 'src/app/triage/page.tsx'
      - 'src/app/fitness/page.tsx'
      - 'tsconfig.json'
      - 'src/app/api/triage-proxy/route.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dogfood-browser.mjs'
      - '.github/workflows/dogfood-01.yml'
  pull_request:
    paths:
      - 'src/lib/dogfood/**'
      - 'src/app/triage/page.tsx'
      - 'src/app/fitness/page.tsx'
      - 'tsconfig.json'
      - 'src/app/api/triage-proxy/route.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dogfood-browser.mjs'
      - '.github/workflows/dogfood-01.yml'
  workflow_dispatch:
jobs:
  scoring:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm run test:dogfood
  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
  lockfile-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check root dependency manifest against lockfile
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const root = lock.packages?.[''] ?? {};
          const missing = [];
          for (const section of ['dependencies','devDependencies']) {
            for (const [name, version] of Object.entries(manifest[section] ?? {})) {
              if (root[section]?.[name] !== version) missing.push(`${section}: ${name} ${version} (lock: ${root[section]?.[name] ?? 'MISSING'})`);
            }
          }
          for (const section of ['dependencies','devDependencies']) {
            for (const [name, version] of Object.entries(root[section] ?? {})) {
              if (manifest[section]?.[name] !== version) missing.push(`extra or mismatched lock ${section}: ${name} ${version}`);
            }
          }
          if (missing.length) { console.error('Lockfile drift:\\n' + missing.join('\\n')); process.exitCode = 1; }
          else console.log('Root manifest matches lockfile');
          NODE
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/dogfood-next.log 2>&1 &
          echo $! > /tmp/dogfood-next.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/triage > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dogfood-next.log
          exit 1
      - run: node scripts/dogfood-browser.mjs
        env:
          DOGFOOD_BASE_URL: http://127.0.0.1:3100
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-browser-failure-evidence
          path: |
            dogfood-artifacts/
            /tmp/dogfood-next.log
          if-no-files-found: warn
          retention-days: 14
