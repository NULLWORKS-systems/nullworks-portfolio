name: DOGFOOD-01 scoring regression
on:
  push:
    paths:
      - 'src/lib/dogfood/**'
      - 'src/app/triage/page.tsx'
      - 'src/app/fitness/page.tsx'
      - 'package.json'
      - '.github/workflows/dogfood-01.yml'
  pull_request:
    paths:
      - 'src/lib/dogfood/**'
      - 'src/app/triage/page.tsx'
      - 'src/app/fitness/page.tsx'
      - 'package.json'
  workflow_dispatch:
jobs:
  scoring:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm run test:dogfood
  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
